<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月次PL会議ダッシュボード</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef3f9; --line:#e1e8f0;
    --text:#1f2a37; --muted:#6b7886; --accent:#2563eb; --accentd:#1d4ed8;
    --good:#15803d; --goodbg:#dcfce7;
    --bad:#dc2626;  --badbg:#fee2e2;
    --warn:#b45309; --warnbg:#fef3c7;
    --totbg:#eaf1ff;
    --shadow:0 1px 3px rgba(20,40,80,.06),0 1px 2px rgba(20,40,80,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Yu Gothic UI",Meiryo,system-ui,sans-serif;font-size:14px}
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  #login .box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px;width:min(92vw,380px);text-align:center}
  #login h2{margin:0 0 6px;font-size:18px;color:#13233a;font-weight:700}
  #login p{margin:0 0 18px;font-size:13px;color:var(--muted)}
  #login input{width:100%;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;outline:none}
  #login input:focus{border-color:var(--accent)}
  #login button{width:100%;font-size:15px;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:9px;padding:11px;cursor:pointer}
  #login button:disabled{opacity:.6;cursor:default}
  #login .err{color:var(--bad);font-size:12px;height:16px;margin-top:8px}
  .wrap{max-width:1400px;margin:0 auto;padding:14px 18px 60px}
  header.top{position:sticky;top:0;z-index:30;background:var(--bg);
    padding:8px 0 10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.4px;color:#13233a}
  h1 .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
  .monthpick{display:flex;align-items:center;gap:8px}
  .monthpick label{font-size:12px;color:var(--muted);font-weight:600}
  select#monthSel{font-size:14px;font-weight:600;color:var(--text);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:var(--shadow)}
  .marrow{font-size:13px;line-height:1;color:var(--text);background:#fff;border:1px solid var(--line);
    border-radius:8px;width:32px;height:34px;cursor:pointer;box-shadow:var(--shadow);
    display:inline-flex;align-items:center;justify-content:center;padding:0;user-select:none}
  .marrow:hover:not(:disabled){background:#f1f5fb}
  .marrow:disabled{opacity:.35;cursor:default}
  .spacer{flex:1}
  .meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
  nav.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 14px}
  nav.tabs button{background:#fff;color:var(--muted);border:1px solid var(--line);
    border-radius:9px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:600;transition:.12s;box-shadow:var(--shadow)}
  nav.tabs button:hover{color:var(--accentd);border-color:#bcd0ee}
  nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:baseline;gap:12px;padding:14px 16px 10px}
  .card-h .nm{font-size:16px;font-weight:700;color:#13233a}
  .card-h .mn{font-size:12px;color:var(--muted)}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:720px}
  thead th{background:var(--panel2);color:var(--muted);font-weight:600;
    font-size:12px;padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.l{text-align:left}
  tbody td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td.l{text-align:left;font-weight:600;color:#22303f}
  tbody tr:hover{background:#f7faff}
  tr.total td{background:var(--totbg);font-weight:700;border-top:2px solid var(--accent)}
  tr.total td.l{color:var(--accentd)}
  tr.adj td{color:var(--muted);font-style:italic;background:#fbfcfe}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .chip{display:inline-block;min-width:54px;padding:3px 9px;border-radius:7px;font-weight:700;font-size:13px}
  .chip.good{background:var(--goodbg);color:var(--good)}
  .chip.bad{background:var(--badbg);color:var(--bad)}
  .chip.warn{background:var(--warnbg);color:var(--warn)}
  .muted{color:var(--muted)}
  .notes{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .note h3{margin:0 0 8px;font-size:13px;color:var(--accentd);display:flex;align-items:center;gap:8px}
  .note .edit{min-height:90px;outline:none;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fcfdff}
  .note .edit:focus{border-color:var(--accent)}
  .note .edit:empty:before{content:attr(data-ph);color:#aab6c4}
  .note .saved{font-size:10px;color:var(--good);margin-top:6px;height:12px}
  footer{margin-top:24px;color:var(--muted);font-size:11px;text-align:center;line-height:1.6}
  @media print{
    header.top,nav.tabs{position:static}
    .card,.note,nav.tabs button,select#monthSel{box-shadow:none}
  }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h2>月次PL会議ダッシュボード</h2>
    <p>閲覧にはパスワードが必要です</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password" autofocus>
      <button type="submit" id="loginBtn">開く</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div class="wrap" style="display:none">
  <header class="top">
    <h1>月次PL会議ダッシュボード<span class="sub" id="subTitle"></span></h1>
    <div class="monthpick"><label for="monthSel">対象月</label><button type="button" id="monthPrev" class="marrow" title="前の月">◀</button><select id="monthSel"></select><button type="button" id="monthNext" class="marrow" title="次の月">▶</button></div>
    <div class="spacer"></div>
    <div class="meta" id="meta"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
  <footer id="foot"></footer>
</div>

// ---- password decryption (AES-CBC + PBKDF2-SHA256) ----
function b64ToBuf(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
async function decryptData(pw){
  const salt=b64ToBuf(ENC.salt), iv=b64ToBuf(ENC.iv), ct=b64ToBuf(ENC.ct);
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ENC.iterations, hash:'SHA-256'}, base, {name:'AES-CBC', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

// ---- comment store: Firebase (shared) or localStorage (this PC) ----
const Notes = (function(){
  const cfg = (FBCONFIG && FBCONFIG.databaseURL) ? FBCONFIG : null;
  let db=null, mode='local';
  if(cfg && typeof firebase!=='undefined'){
    try{ firebase.initializeApp(cfg); db=firebase.database(); mode='cloud'; }catch(e){ mode='local'; }
  }
  function path(k){ return 'comments/'+String(k).replace(/[.#$\[\]\/]/g,'_'); }
  return {
    mode,
    get(k,cb){ if(mode==='cloud'){ db.ref(path(k)).once('value').then(s=>cb(s.val()||'')).catch(()=>cb(localStorage.getItem(k)||'')); } else cb(localStorage.getItem(k)||''); },
    set(k,v){ if(mode==='cloud') db.ref(path(k)).set(v); localStorage.setItem(k,v); },
    subscribe(k,cb){ if(mode==='cloud'){ const r=db.ref(path(k)); const h=r.on('value',s=>cb(s.val()||'')); return ()=>r.off('value',h);} return ()=>{}; }
  };
})();

// ---- formatting ----
function yen(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return Math.round(v).toLocaleString('ja-JP'); }
function num(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return Math.round(v).toLocaleString('ja-JP'); }
function yoyChip(v){
  if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>';
  let cls = v>=1?'good':(v>=0.95?'warn':'bad');
  return '<span class="chip '+cls+'">'+(v*100).toFixed(1)+'%</span>';
}

function costChip(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>';
  let cls = v>=0.45?'bad':(v>=0.42?'warn':''); return '<span class="chip '+cls+'">'+(v*100).toFixed(1)+'%</span>'; }
function opRatioCell(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>';
  return '<span class="'+(v<0?'neg':'pos')+'" style="font-weight:700">'+(v*100).toFixed(1)+'%</span>'; }

const COLS = ['売上高','昨年比','客数','客単価','売上原価','月末棚卸高','原価率','人件費率','営業利益率'];
function rowCells(r){
  return '<td>'+yen(r.uri)+'</td>'
       + '<td>'+yoyChip(r.zennenhi)+'</td>'
       + '<td>'+num(r.kyaku)+'</td>'
       + '<td>'+yen(r.tanka)+'</td>'
       + '<td>'+yen(r.cost)+'</td>'
       + '<td>'+yen(r.inventory)+'</td>'
       + '<td>'+costChip(r.costRatio)+'</td>'
       + '<td>'+pctv(r.laborRatio)+'</td>'
       + '<td>'+opRatioCell(r.opRatio)+'</td>';
}
function topCard(divName, list){
  if(!list||!list.length) return '';
  let h='<div class="card"><div class="card-h"><span class="nm">売上商品 上位'+list.length+'</span><span class="mn">'+divName+'（税込）</span></div>'
      + '<div class="tblwrap"><table style="min-width:320px"><thead><tr><th class="l">順位</th><th class="l">商品</th><th>数量</th><th>売上</th></tr></thead><tbody>';
  list.forEach((it,i)=>{ h+='<tr><td class="l">'+(i+1)+'</td><td class="l" style="white-space:normal;max-width:150px">'+it.name+'</td><td>'+num(it.qty)+'</td><td>'+yen(it.amount)+'</td></tr>'; });
  h+='</tbody></table></div></div>';
  return h;
}
// 費用を分離できない付替（仕出し等）がある部門は、率の分母が表の売上高と異なるため注記する
function addbackNote(period, deptId){
  const ids = deptId ? [deptId] : DATA.divisions.map(d=>d.id);
  const msgs=[];
  for(const id of ids){
    const t=(period.divisions[id]||{}).tkc;
    if(!t) continue;
    const nm=(DATA.divisions.find(x=>x.id===id)||{}).name||id;
    if(t.salesAddback){
      msgs.push(nm+'の原価率・人件費率・営業利益率は、TKCで費用を分離できない付替分（'+yen(t.salesAddback)
        +'円）を戻した売上高 '+yen(t.sales)+'円 を分母に算出しています（表の売上高は付替後の額）。配賦率を設定すると分離されます。');
    }else if(t.allocNote){
      msgs.push(nm+'の費用はTKCで独立して把握できないため、'+t.allocNote+'した見込値です（同額を元部門の費用から控除済み）。'
        +'配賦していない科目は「—」で表示しています。');
    }
  }
  if(!msgs.length) return '';
  return '<div style="padding:0 6px 12px;font-size:11px;color:var(--muted);line-height:1.7">※ '+msgs.join('<br>※ ')+'</div>';
}
function tableHTML(rows, total, totalLabel){
  let h='<div class="tblwrap"><table><thead><tr><th class="l">店舗／部門</th>';
  for(const c of COLS) h+='<th>'+c+'</th>';
  h+='</tr></thead><tbody>';
  for(const r of rows){ const cls=r.isAdj?' class="adj"':''; h+='<tr'+cls+'><td class="l">'+r.name+'</td>'+rowCells(r)+'</tr>'; }
  if(total) h+='<tr class="total"><td class="l">'+totalLabel+'</td>'+rowCells(total)+'</tr>';
  h+='</tbody></table></div>';
  return h;
}

const PAYS = [['cash','現金'],['credit','クレジット'],['code','コード決済'],['paypay','PayPay'],['dpay','d払い'],['aupay','au PAY']];
function payCard(rows, total){
  let cols = rows.concat(total?[Object.assign({name:'合計'},total)]:[]);
  let h='<div class="card"><div class="card-h"><span class="nm">決済別内訳（税込）</span></div><div class="tblwrap"><table><thead><tr><th class="l">決済</th>';
  for(const c of cols) h+='<th>'+c.name+'</th>';
  h+='</tr></thead><tbody>';
  for(const [k,lab] of PAYS){
    h+='<tr><td class="l">'+lab+'</td>';
    for(const c of cols){ const v=(c.pay||{})[k]; h+='<td>'+yen(v)+'</td>'; }
    h+='</tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}

function pctv(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return (v*100).toFixed(1)+'%'; }
function signYen(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; const c=v<0?'neg':'pos'; return '<span class="'+c+'">'+Math.round(v).toLocaleString('ja-JP')+'</span>'; }
function tkcCard(t){
  if(!t) return '';
  let h='<div class="card"><div class="card-h"><span class="nm">損益（部門別）</span><span class="mn">'
      + (t.allocNote ? t.allocNote : '売上=POS純売上／原価・費用=TKC月間発生')+'</span></div>'
      + '<div class="tblwrap"><table><thead><tr><th class="l">項目</th><th>金額</th><th>対売上</th></tr></thead><tbody>';
  h+='<tr><td class="l">売上高（POS）</td><td>'+yen(t.sales)+'</td><td class="muted">—</td></tr>';
  h+='<tr><td class="l">売上原価</td><td>'+yen(t.cost)+'</td><td>'+pctv(t.costRatio)+'</td></tr>';
  h+='<tr><td class="l">販管費計</td><td>'+yen(t.sga)+'</td><td class="muted">—</td></tr>';
  h+='<tr><td class="l">　うち人件費</td><td>'+yen(t.labor)+'</td><td>'+pctv(t.laborRatio)+'</td></tr>';
  h+='<tr class="total"><td class="l">営業利益率</td><td class="muted">—</td><td>'+pctv(t.opRatio)+'</td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

function plTable(period){
  const rows=[];
  DATA.divisions.forEach((d)=>{ const t=(period.divisions[d.id]||{}).tkc; if(t) rows.push({name:d.name,t:t}); });
  if(!rows.length) return '';
  const tot=period.company.tkc;
  const cells=t=>'<td>'+yen(t.sales)+'</td><td>'+yen(t.cost)+'</td><td>'+pctv(t.costRatio)+'</td>'
    +'<td>'+yen(t.labor)+'</td><td>'+pctv(t.laborRatio)+'</td><td>'+yen(t.sga)+'</td>'
    +'<td>'+pctv(t.opRatio)+'</td>';
  let h='<div class="card"><div class="card-h"><span class="nm">損益一覧（部門別）</span>'
    +'<span class="mn">売上=POS純売上／原価・費用=TKC月間発生／営業利益率=(売上−原価−販管費)÷売上</span></div>'
    +'<div class="tblwrap"><table><thead><tr><th class="l">部門</th><th>売上高</th><th>売上原価</th><th>原価率</th>'
    +'<th>人件費</th><th>人件費率</th><th>販管費</th><th>営業利益率</th></tr></thead><tbody>';
  for(const r of rows) h+='<tr><td class="l">'+r.name+'</td>'+cells(r.t)+'</tr>';
  if(tot) h+='<tr class="total"><td class="l">全社 合計</td>'+cells(tot)+'</tr>';
  h+='</tbody></table></div></div>';
  return h;
}

// ---- notes ----
const NOTE_DEFS=[['issue','確認できた課題','店舗ごとの課題を入力…'],
  ['action','売上向上のために行う取り組み','取り組み・改善計画を入力…'],
  ['staff','人員の過不足','人員状況を入力…']];
function noteKey(scopeKey,k){ return 'note_'+curMonth+'_'+scopeKey+'_'+k; }

// 全社ページ用：各部門タブで入力されたコメントを1表に集約（読み取り専用）
function notesDigestCard(){
  const divs=DATA.divisions||[];
  if(!divs.length) return '';
  let h='<div class="card"><div class="card-h"><span class="nm">各部門のコメント一覧</span>'
      + '<span class="mn">'+monthLabel(curMonth)+'／各部門タブで入力した内容がここに集まります（編集は各タブで）</span></div>'
      + '<div class="tblwrap"><table><thead><tr><th class="l" style="width:110px">部門</th>';
  for(const [,title] of NOTE_DEFS) h+='<th class="l">'+title+'</th>';
  h+='</tr></thead><tbody>';
  for(const d of divs){
    h+='<tr><td class="l" style="vertical-align:top">'+d.name+'</td>';
    for(const [k] of NOTE_DEFS){
      h+='<td class="l ro" data-key="'+noteKey(d.id,k)+'" style="vertical-align:top;white-space:pre-wrap;'
        +'font-weight:400;font-size:12px;line-height:1.75;min-width:200px"></td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}

function noteBlock(scopeKey){
  const defs=NOTE_DEFS.map(([k,title,ph])=>[k,'▼ '+title,ph]);
  let h='<div class="notes">';
  for(const [k,title,ph] of defs){
    const id=noteKey(scopeKey,k);
    h+='<div class="note"><h3>'+title+'</h3><div class="edit" contenteditable="true" data-ph="'+ph+'" data-key="'+id+'"></div><div class="saved" id="sv_'+id+'"></div></div>';
  }
  return h+'</div>';
}
function hydrateNotes(){
  (window._noteSubs||[]).forEach(u=>{try{u&&u();}catch(e){}}); window._noteSubs=[];
  document.querySelectorAll('.edit').forEach(el=>{
    const key=el.dataset.key;
    Notes.get(key,v=>{ if(document.activeElement!==el) el.innerText=v; });
    el.addEventListener('input',()=>{ Notes.set(key,el.innerText);
      const sv=document.getElementById('sv_'+key);
      if(sv){ sv.textContent=(Notes.mode==='cloud'?'共有に保存しました ✓':'保存しました ✓'); clearTimeout(el._t); el._t=setTimeout(()=>sv.textContent='',1400); } });
    window._noteSubs.push(Notes.subscribe(key,v=>{ if(document.activeElement!==el && el.innerText!==v) el.innerText=v; }));
  });
  // 読み取り専用の集約表示（全社ページのコメント一覧）
  document.querySelectorAll('.ro').forEach(el=>{
    const key=el.dataset.key;
    const put=v=>{ const t=(v||'').trim();
      el.textContent=t||'（未入力）'; el.classList.toggle('muted',!t); };
    Notes.get(key,put);
    window._noteSubs.push(Notes.subscribe(key,put));
  });
}

function breakdownCard(bd, divName){
  if(!bd||!bd.rows||!bd.rows.length) return '';
  let h='<div class="card"><div class="card-h"><span class="nm">売上内訳（カテゴリ別）</span><span class="mn">'+divName+'／純売上を販売構成比で按分（税抜）</span></div>'
      + '<div class="tblwrap"><table style="min-width:360px"><thead><tr><th class="l">カテゴリ</th><th>売上</th><th>構成比</th></tr></thead><tbody>';
  for(const r of bd.rows){
    h+='<tr><td class="l">'+r.name+'</td><td>'+yen(r.amount)+'</td><td>'+(r.share*100).toFixed(1)+'%</td></tr>';
  }
  h+='<tr class="total"><td class="l">合計（＝純売上）</td><td>'+yen(bd.total)+'</td><td>100.0%</td></tr>';
  h+='</tbody></table></div>';
  h+='<div style="padding:8px 16px 12px;font-size:11px;color:var(--muted)">※他部門へ付替える売上（ベーカリーへの物販＝パン類／仕出し部門への仕出し）は除外済み。合計は上表の純売上（付替後・税抜）と一致します。各カテゴリ額はレシート明細の販売構成比で純売上を按分。</div></div>';
  return h;
}

function invCard(inv, title){
  if(!inv) return '';
  let h='<div class="card"><div class="card-h"><span class="nm">棚卸分析'+(title?'（'+title+'）':'')+'</span><span class="mn">期末棚卸は上表に記載／適正＝原価ベースの在庫日数</span></div>'
    +'<div class="tblwrap"><table style="min-width:320px"><tbody>';
  h+='<tr><td class="l">適正棚卸'+(inv.days?'（原価'+inv.days+'日分）':'')+'</td><td>'+yen(inv.appropriate)+'</td></tr>';
  if(inv.noStock){
    h+='<tr class="total"><td class="l">乖離</td><td class="muted">—（棚卸未実施）</td></tr>';
  } else {
    const r=inv.ratio;
    const cls=(r!==null&&(r>=1.5||r<0.8))?'neg':((r!==null&&r>=1.2)?'warn':'pos');
    const rp=(r!==null)?'　<span class="'+cls+'" style="font-weight:700">('+(r*100).toFixed(0)+'%)</span>':'';
    h+='<tr class="total"><td class="l">乖離</td><td>'+signYen(inv.gap)+rp+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div style="padding:11px 16px 14px"><div style="font-size:12px;color:var(--accentd);font-weight:700;margin-bottom:5px">🤖 AI分析コメント</div>'
    +'<div style="font-size:13px;line-height:1.75;color:var(--text)">'+inv.comment+'</div></div></div>';
  return h;
}

function weeklyCard(){
  const weeks=DATA.weeks||[];
  if(!weeks.length) return '<div class="card"><div class="card-h"><span class="nm">週次データなし</span></div></div>';
  // 週次はPOS日次から作るため、POSを通さない部門（催事＝TKCのみ）は列に出さない
  const cols=DATA.divisions.filter(d=>!d.tkcOnly);
  const excl=DATA.divisions.filter(d=>d.tkcOnly).map(d=>d.name);
  let h='<div class="card"><div class="card-h"><span class="nm">週次売上速報</span><span class="mn">純売上（税抜）／直近'+weeks.length+'週・新しい順</span></div>'
      + '<div class="tblwrap"><table><thead><tr><th class="l">週</th>';
  for(const d of cols) h+='<th>'+d.short+'</th>';
  h+='<th>全社 売上</th><th>前年同週比</th></tr></thead><tbody>';
  for(const w of weeks){
    h+='<tr><td class="l">'+w.label+'</td>';
    for(const d of cols) h+='<td>'+yen(w.depts[d.id])+'</td>';
    h+='<td><b>'+yen(w.company)+'</b></td><td>'+yoyChip(w.yoy)+'</td></tr>';
  }
  h+='</tbody></table></div>';
  if(excl.length) h+='<div style="padding:0 16px 12px;font-size:11px;color:var(--muted)">※ 週次はPOS日次から集計するため、'+excl.join('・')+'（POSを通さずTKC試算表から取得）は含みません。</div>';
  h+='</div>';
  return h;
}

function reconcileCard(period){
  const rc=period&&period.reconcile;
  if(!rc) return '<div class="card"><div class="card-h"><span class="nm">突合データなし</span><span class="mn">この月は売上入力アプリのデータがありません</span></div></div>';
  let h='<div class="card"><div class="card-h"><span class="nm">突合（POS vs 売上入力アプリ）</span><span class="mn">純売上・税抜／差異5%超は色付き</span></div>'
    +'<div class="tblwrap"><table style="min-width:520px"><thead><tr><th class="l">部門</th><th>PL計上(税抜)</th><th>アプリ(税抜)</th><th>差異</th><th>差異%</th></tr></thead><tbody>';
  for(const r of rc.rows){
    const cls=r.flag?'neg':'';
    const pct=(r.pct===null||r.pct===undefined)?'<span class="muted">—</span>':'<span class="'+cls+'" style="font-weight:700">'+(r.pct*100).toFixed(1)+'%</span>';
    h+='<tr><td class="l">'+r.name+'</td><td>'+yen(r.pos)+'</td><td>'+yen(r.app)+'</td><td>'+signYen(r.diff)+'</td><td>'+pct+'</td></tr>';
  }
  h+='</tbody></table></div>';
  if(rc.extra&&rc.extra.length){
    h+='<div class="card-h" style="padding-top:12px"><span class="nm" style="font-size:13px">アプリのみのチャネル（POS対象外）</span></div>';
    h+='<div class="tblwrap"><table style="min-width:320px"><thead><tr><th class="l">チャネル</th><th>売上(税抜)</th></tr></thead><tbody>';
    for(const e of rc.extra) h+='<tr><td class="l">'+e.name+'</td><td>'+yen(e.app)+'</td></tr>';
    h+='</tbody></table></div>';
  }
  if(rc.daily&&rc.daily.length){
    h+='<div class="card-h" style="padding-top:12px"><span class="nm" style="font-size:13px">差異のある日（日次ドリルダウン）</span><span class="mn">差異¥2万以上の日・POS純売上ベース</span></div>';
    h+='<div class="tblwrap"><table style="min-width:520px"><thead><tr><th class="l">日付</th><th class="l">部門</th><th>POS(税抜)</th><th>アプリ(税抜)</th><th>差異</th></tr></thead><tbody>';
    for(const r of rc.daily) h+='<tr><td class="l">'+r.date+'</td><td class="l">'+r.name+'</td><td>'+yen(r.pos)+'</td><td>'+yen(r.app)+'</td><td>'+signYen(r.diff)+'</td></tr>';
    h+='</tbody></table></div>';
  } else if(rc.daily){
    h+='<div style="padding:6px 16px 0;font-size:12px;color:var(--good)">日次で¥2万以上ズレている日はありません。</div>';
  }
  h+='<div style="padding:8px 16px 12px;font-size:11px;color:var(--muted)">※PL計上＝とんかつ/ベーカリーはPOS純売上、仕出し/金曜日はTKC試算表由来（いずれも税抜）。アプリ＝税抜入力をそのまま集計。対応：ベーカリー↔ベーカリー+ソフト+チーズケーキ、仕出し↔仕出、金曜日↔金曜日。日次はPOS登録のある部門（とんかつ/ベーカリー）のみ。差異は入力漏れ・計上タイミング差の確認用。</div></div>';
  return h;
}

// ---- render ----
function monthLabel(key){ const m=DATA.months.find(x=>x.key===key); return m?(m.full||m.label):key; }
function render(){
  const period=DATA.periods[curMonth];
  document.getElementById('subTitle').textContent='／ '+monthLabel(curMonth);
  const tab=tabsList[curTab];
  let html='';
  if(tab.key==='weekly'){ html=weeklyCard(); }
  else if(tab.key==='reconcile'){ html=reconcileCard(period); }
  else if(!period){ html='<div class="card"><div class="card-h"><span class="nm">データなし</span></div></div>'; }
  else if(tab.key==='company'){
    const c=period.company;
    html+='<div class="card"><div class="card-h"><span class="nm">全社サマリー</span><span class="mn">'+monthLabel(curMonth)+'</span></div>'+tableHTML(c.rows,c.total,'全社 合計')+'</div>';
    html+=addbackNote(period,null);
    html+='<div class="notes">';
    DATA.divisions.forEach((d,i)=>{ html+=topCard(d.name, period.divisions[d.id].top); });
    html+='</div>';
    html+=notesDigestCard();   // 全社の入力欄は使わないため置かない（入力は各部門タブ）
  } else {
    const d=DATA.divisions[tab.key];
    const dd=period.divisions[d.id];
    const srcNote=d.tkcOnly?'（売上・費用ともTKC試算表／税抜）':'（純売上は付替後・税抜）';
    html+='<div class="card"><div class="card-h"><span class="nm">'+d.name+'</span><span class="mn">'+monthLabel(curMonth)+srcNote+'</span></div>'+tableHTML([],dd.total,d.name)+'</div>';
    html+=addbackNote(period,d.id);
    html+=breakdownCard(dd.breakdown, d.name);
    html+=tkcCard(dd.tkc);
    html+=invCard(dd.inv);
    html+=topCard(d.name, dd.top);
    html+=noteBlock(d.id);
  }
  document.getElementById('view').innerHTML=html;
  hydrateNotes();
  document.querySelectorAll('nav.tabs button').forEach((b,i)=>b.classList.toggle('on',i===curTab));
}

function build(){
  curMonth=DATA.defaultMonth;
  tabsList=[{key:'company',label:'全社'}];
  DATA.divisions.forEach((d,i)=>tabsList.push({key:i,label:d.short}));
  tabsList.push({key:'weekly',label:'週次速報'});
  tabsList.push({key:'reconcile',label:'突合'});
  const tabsEl=document.getElementById('tabs');
  tabsEl.innerHTML=tabsList.map(t=>'<button>'+t.label+'</button>').join('');
  tabsEl.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{curTab=i;render();});
  const sel=document.getElementById('monthSel');
  const fys=[...new Set(DATA.months.map(m=>m.fy))].sort((a,b)=>b-a);
  let html='';
  for(const fy of fys){
    const items=DATA.months.filter(m=>m.fy===fy).sort((a,b)=>(b.ord||0)-(a.ord||0));
    if(!items.length) continue;
    html+='<optgroup label="'+fy+'年度">'+items.map(m=>'<option value="'+m.key+'"'+(m.key===curMonth?' selected':'')+'>'+m.label+'</option>').join('')+'</optgroup>';
  }
  sel.innerHTML=html; sel.value=curMonth;
  monthOrder=DATA.months.slice().filter(m=>/^\d{6}$/.test(m.key)).sort((a,b)=>(a.fy-b.fy)||((a.ord||0)-(b.ord||0))).map(m=>m.key);
  const prevBtn=document.getElementById('monthPrev'), nextBtn=document.getElementById('monthNext');
  function setMonth(k){ curMonth=k; sel.value=k; updateArrows(); render(); }
  function updateArrows(){ const i=monthOrder.indexOf(curMonth); prevBtn.disabled=(i<=0); nextBtn.disabled=(i<0||i>=monthOrder.length-1); }
  sel.onchange=()=>setMonth(sel.value);
  prevBtn.onclick=()=>{ const i=monthOrder.indexOf(curMonth); if(i>0) setMonth(monthOrder[i-1]); };
  nextBtn.onclick=()=>{ const i=monthOrder.indexOf(curMonth); if(i>=0&&i<monthOrder.length-1) setMonth(monthOrder[i+1]); };
  updateArrows();
  const share=(Notes.mode==='cloud')?'<span style="color:var(--good);font-weight:700">● コメント共有: ON</span>':'<span style="color:var(--muted)">○ コメント共有: OFF（このPCのみ）</span>';
  document.getElementById('meta').innerHTML=share+'<br>元データ: '+DATA.sourceFile+'　生成: '+DATA.generatedAt;
  document.getElementById('foot').textContent='※ 売上高＝POS純売上（税抜）。パン（○円パン/スタッフ割パン）はとんかつ店ぶんをベーカリーへ税抜換算で移管済。仕出し（Ｔ仕出し）はとんかつ店から仕出し部門へ税抜換算（8%）で移管しており、レジで組数・客数が取れないため客数・客単価は「—」。金曜日のみしな（週1の催事出店）はPOSを通さないため、売上・費用ともTKC部門別試算表から取得（客数の取得不可／週次速報には含まない）。原価・人件費・営業利益はTKC月間発生（部門別）から算出（営業利益＝売上−原価−販管費、本部費配賦前）。売上商品ランキングはレシート明細の税込集計。ベーカリーの客単価はまきばのソフト・100日（POS未連携の一括計上／キャンペーン）を除外して算出。前年比は過去年の同月JNL蓄積分から算出。';
  render();
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  btn.disabled=true; btn.textContent='確認中…'; err.textContent='';
  try{
    DATA=JSON.parse(await decryptData(pw));
    document.getElementById('login').style.display='none';
    document.querySelector('.wrap').style.display='';
    build();
  }catch(ex){ err.textContent='パスワードが違います'; btn.disabled=false; btn.textContent='開く'; document.getElementById('pw').select(); }
});
