<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月次PL会議ダッシュボード</title>
<style>
  :root{
    --bg:#f5eff0; --panel:#ffffff; --panel2:#faf6f6; --line:#e9dee0;
    --text:#2a1c1e; --muted:#7a6467;
    --sidebar:#7c2732; --sidebar-2:#66202a; --sidebar-txt:#eccdd1; --sidebar-txt2:#cf9aa2;
    --accent:#b23a46; --accentd:#93303b; --accbg:#f6e7e9;
    --good:#15803d; --goodbg:#e4f2e8;
    --bad:#c0392b;  --badbg:#fbe7e4;
    --warn:#b45309; --warnbg:#fdf0d9;
    --sat:#2f6fb0; --sun:#c0392b;
    --totbg:#f6e7e9; --rowsub:#f8f0f1;
    --shadow:0 1px 3px rgba(80,25,35,.09);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#161011; --panel:#1e1618; --panel2:#211719; --line:#332527;
    --text:#f0e4e6; --muted:#b09a9d;
    --sidebar:#4d1720; --sidebar-2:#63202a; --sidebar-txt:#e9c5ca; --sidebar-txt2:#c08f97;
    --accent:#e0707c; --accentd:#f0929b; --accbg:#2c1a1e;
    --good:#4ade80; --goodbg:#12331f;
    --bad:#f87171;  --badbg:#3a1b1b;
    --warn:#fbbf24; --warnbg:#3a2c0c;
    --sat:#7ca8dd; --sun:#f4888a;
    --totbg:#2c1a1e; --rowsub:#241a1c;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#161011; --panel:#1e1618; --panel2:#211719; --line:#332527;
    --text:#f0e4e6; --muted:#b09a9d;
    --sidebar:#4d1720; --sidebar-2:#63202a; --sidebar-txt:#e9c5ca; --sidebar-txt2:#c08f97;
    --accent:#e0707c; --accentd:#f0929b; --accbg:#2c1a1e;
    --good:#4ade80; --goodbg:#12331f;
    --bad:#f87171;  --badbg:#3a1b1b;
    --warn:#fbbf24; --warnbg:#3a2c0c;
    --sat:#7ca8dd; --sun:#f4888a;
    --totbg:#2c1a1e; --rowsub:#241a1c;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased}
  /* login */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  #login .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px 28px;width:min(92vw,380px);text-align:center}
  #login .logo{width:170px;height:auto;margin:0 auto 16px;display:block}
  #login h2{margin:0 0 6px;font-size:16px;color:var(--text);font-weight:700}
  #login p{margin:0 0 18px;font-size:13px;color:var(--muted)}
  #login input{width:100%;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;outline:none;background:var(--panel2);color:var(--text)}
  #login input:focus{border-color:var(--accent)}
  #login button{width:100%;font-size:15px;font-weight:800;color:#fff;background:var(--accentd);border:0;border-radius:9px;padding:11px;cursor:pointer}
  #login button:disabled{opacity:.6;cursor:default}
  #login .err{color:var(--bad);font-size:12px;height:16px;margin-top:8px}
  /* shell */
  .app{display:grid;grid-template-columns:226px 1fr;min-height:100vh}
  .side{background:var(--sidebar);color:var(--sidebar-txt);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px}
  .brand img{width:150px;height:auto;filter:brightness(0) invert(1);display:block}
  .brand .cap{font-size:10px;color:var(--sidebar-txt2);letter-spacing:.16em;font-weight:700}
  .nav{padding:6px 10px;overflow-y:auto;flex:1}
  .nav button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--sidebar-txt);
    background:transparent;border:0;text-align:left;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;margin-bottom:1px}
  .nav button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.85;flex:none}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.on{background:var(--sidebar-2);color:#fff}
  .nav button.on svg{opacity:1}
  .sfoot{padding:11px 16px;font-size:10px;color:var(--sidebar-txt2);border-top:1px solid rgba(255,255,255,.1);line-height:1.6}
  .main{padding:16px 20px 50px;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em;color:var(--text)}
  .topbar h1 .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
  .spacer{flex:1}
  .meta{font-size:10.5px;color:var(--muted);text-align:right;line-height:1.5}
  .monthpick{display:flex;align-items:center;gap:6px}
  .monthpick label{font-size:11px;color:var(--muted);font-weight:700}
  select,input[type=month]{font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;box-shadow:var(--shadow)}
  .marrow{font-size:13px;line-height:1;color:var(--text);background:var(--panel);border:1px solid var(--line);
    border-radius:8px;width:32px;height:34px;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;padding:0;user-select:none}
  .marrow:hover:not(:disabled){background:var(--panel2)} .marrow:disabled{opacity:.35;cursor:default}
  .ctx{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.03em}
  .seg{display:inline-flex;background:var(--accbg);border-radius:9px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 15px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--accentd);box-shadow:var(--shadow)}
  /* cards / tables */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:baseline;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
  .card-h .nm{font-size:15px;font-weight:800;color:var(--text)}
  .card-h .mn{font-size:11.5px;color:var(--muted)}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  thead th{background:var(--panel2);color:var(--muted);font-weight:700;font-size:11px;padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
  thead th.l{text-align:left}
  tbody td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
  tbody td.l{text-align:left;font-weight:600;color:var(--text)}
  tbody tr:hover{background:var(--panel2)}
  tr.total td{background:var(--totbg);font-weight:800;border-top:2px solid var(--accent)}
  tr.total td.l{color:var(--accentd)}
  tr.adj td{color:var(--muted);font-style:italic}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .chip{display:inline-block;min-width:50px;padding:3px 9px;border-radius:7px;font-weight:700;font-size:12.5px}
  .chip.good{background:var(--goodbg);color:var(--good)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.warn{background:var(--warnbg);color:var(--warn)}
  .muted{color:var(--muted)}
  /* daily PL matrix */
  th.stk,td.stk{position:sticky;left:0;background:var(--panel);z-index:2;text-align:left;min-width:130px}
  thead th.stk{z-index:3;background:var(--panel2)}
  th.stk2,td.stk2{position:sticky;left:130px;background:var(--panel);z-index:2;text-align:left;color:var(--muted);font-size:11px;min-width:96px}
  thead th.stk2{z-index:3;background:var(--panel2)}
  td.sat,th.sat{color:var(--sat)} td.sun,th.sun{color:var(--sun)}
  .dw{display:block;font-size:9.5px;font-weight:600;opacity:.85;margin-top:1px}
  tr.mrow-sub td{font-weight:800;background:var(--rowsub)}
  tr.mrow-op td{background:var(--accbg);font-weight:800;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)}
  td.mtot{font-weight:800;background:var(--rowsub)}
  td.fv{text-align:center;color:var(--muted);font-size:11px}
  /* notes */
  .notes{margin-top:4px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .note h3{margin:0 0 8px;font-size:13px;color:var(--accentd);display:flex;align-items:center;gap:8px}
  .note .edit{min-height:88px;outline:none;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
  .note .edit:focus{border-color:var(--accent)}
  .note .edit:empty:before{content:attr(data-ph);color:var(--muted);opacity:.7}
  .note .saved{font-size:10px;color:var(--good);margin-top:6px;height:12px}
  .foot{margin-top:20px;color:var(--muted);font-size:10.5px;line-height:1.7}
  .foot summary{cursor:pointer;font-weight:700;color:var(--muted)}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    .side{position:sticky;top:0;z-index:40;height:auto}
    .brand{flex-direction:row;align-items:center;padding:9px 14px;gap:10px}
    .brand img{width:118px}.brand .cap{display:none}
    /* モバイルは全メニューを折り返しで並べ、全項目をタップ可能に */
    .nav{display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px 10px;overflow:visible}
    .nav button{width:auto;margin:0;padding:8px 12px;font-size:12px;background:rgba(255,255,255,.10)}
    .nav button svg{display:none}
    .nav button.on{background:#fff;color:var(--accentd)}
    .sfoot{display:none}
    .main{padding:14px 14px 44px}
    .topbar h1{font-size:18px}
  }
</style>
</head>

// ---- password decryption (AES-CBC + PBKDF2-SHA256) ----
function b64ToBuf(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; }
async function decryptData(pw){
  const salt=b64ToBuf(ENC.salt), iv=b64ToBuf(ENC.iv), ct=b64ToBuf(ENC.ct);
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ENC.iterations, hash:'SHA-256'}, base, {name:'AES-CBC', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

// ---- comment store: Firebase (shared) or localStorage ----
const Notes = (function(){
  const cfg = (FBCONFIG && FBCONFIG.databaseURL) ? FBCONFIG : null;
  let db=null, mode='local';
  if(cfg && typeof firebase!=='undefined'){
    try{ firebase.initializeApp(cfg); db=firebase.database(); mode='cloud'; }catch(e){ mode='local'; }
  }
  function path(k){ return 'comments/'+String(k).replace(/[.#$\[\]\/]/g,'_'); }
  return {
    mode,
    get(k,cb){ if(mode==='cloud'){ db.ref(path(k)).once('value').then(s=>cb(s.val()||'')).catch(()=>cb(localStorage.getItem(k)||'')); } else cb(localStorage.getItem(k)||''); },
    set(k,v){ if(mode==='cloud') db.ref(path(k)).set(v); localStorage.setItem(k,v); },
    subscribe(k,cb){ if(mode==='cloud'){ const r=db.ref(path(k)); const h=r.on('value',s=>cb(s.val()||'')); return ()=>r.off('value',h);} return ()=>{}; }
  };
})();

// ---- formatting ----
function yen(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return Math.round(v).toLocaleString('ja-JP'); }
function num(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return Math.round(v).toLocaleString('ja-JP'); }
function pctv(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return (v*100).toFixed(1)+'%'; }
function signYen(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; const c=v<0?'neg':'pos'; return '<span class="'+c+'">'+Math.round(v).toLocaleString('ja-JP')+'</span>'; }
function yoyChip(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>';
  let cls=v>=1?'good':(v>=0.95?'warn':'bad'); return '<span class="chip '+cls+'">'+(v*100).toFixed(1)+'%</span>'; }
function costChip(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>';
  let cls=v>=0.45?'bad':(v>=0.42?'warn':''); return '<span class="chip '+cls+'">'+(v*100).toFixed(1)+'%</span>'; }
function opRatioCell(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>';
  return '<span class="'+(v<0?'neg':'pos')+'" style="font-weight:700">'+(v*100).toFixed(1)+'%</span>'; }

// POS外手入力（税率別内訳で入力）を部門別の課税売上(税抜・割戻し)に換算して読む
function getTexExtra(mk){ try{ const v=localStorage.getItem('taxextra_'+mk); const a=v?JSON.parse(v):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function texByDept(mk){ const o={}; getTexExtra(mk).forEach(r=>{ const id=r.dept||'__other';
  const ex=Math.round((+r.incl10||0)/1.10)+Math.round((+r.incl8||0)/1.08); if(ex) o[id]=(o[id]||0)+ex; }); return o; }
const COLS=['売上高','昨年比','客数','客単価','売上原価','月末棚卸高','原価率','人件費率','営業利益率'];
function rowCells(r){
  return '<td>'+yen(r.uri)+'</td><td>'+yoyChip(r.zennenhi)+'</td><td>'+num(r.kyaku)+'</td><td>'+yen(r.tanka)+'</td>'
       +'<td>'+yen(r.cost)+'</td><td>'+yen(r.inventory)+'</td><td>'+costChip(r.costRatio)+'</td><td>'+pctv(r.laborRatio)+'</td><td>'+opRatioCell(r.opRatio)+'</td>';
}
function tableHTML(rows, total, totalLabel){
  let h='<div class="tblwrap"><table style="min-width:760px"><thead><tr><th class="l">店舗／部門</th>';
  for(const c of COLS) h+='<th>'+c+'</th>';
  h+='</tr></thead><tbody>';
  for(const r of rows){ const cls=r.isAdj?' class="adj"':''; h+='<tr'+cls+'><td class="l">'+r.name+'</td>'+rowCells(r)+'</tr>'; }
  if(total) h+='<tr class="total"><td class="l">'+totalLabel+'</td>'+rowCells(total)+'</tr>';
  h+='</tbody></table></div>';
  return h;
}
function topCard(divName, list){

function hydrateTaxExtra(){
  const wrap=document.getElementById('taxMainWrap'); if(!wrap) return;
  const key='taxextra_'+curMonth;
  const pos=window._texPos||[], depts=window._texDepts||[];
  const nameOf=id=>{ const d=depts.find(x=>x.id===id); return d?d.name:id; };
  const inp='font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text)';
  let rows=[];
  const wm=(incl,rate)=>{ const ex=Math.round(incl/rate); return {ex,tax:incl-ex}; };
  function renderMain(){
    const m={},order=[];
    pos.forEach(r=>{ m[r.id]={name:r.name,incl10:r.incl10,incl8:r.incl8,extra:false}; order.push(r.id); });
    rows.forEach(r=>{ const id=r.dept||'__other'; if(!m[id]){ m[id]={name:nameOf(id),incl10:0,incl8:0,extra:true}; order.push(id); }
      m[id].incl10+=(+r.incl10||0); m[id].incl8+=(+r.incl8||0); if((+r.incl10||0)||(+r.incl8||0)) m[id].hasExtra=true; });
    const c={incl10:0,ex10:0,tax10:0,incl8:0,ex8:0,tax8:0,taxable:0};
    let body='';
    order.forEach(id=>{ const r=m[id]; const a=wm(r.incl10,1.10), b=wm(r.incl8,1.08), taxable=a.ex+b.ex;
      const mk2=r.hasExtra?' <span class="chip" style="background:var(--accbg);color:var(--accentd);font-size:10px;padding:1px 6px">手入力含</span>':'';
      body+='<tr><td class="l">'+r.name+mk2+'</td><td>'+yen(r.incl10)+'</td><td>'+yen(a.ex)+'</td><td class="muted">'+yen(a.tax)+'</td><td>'+yen(r.incl8)+'</td><td>'+yen(b.ex)+'</td><td class="muted">'+yen(b.tax)+'</td><td><b>'+yen(taxable)+'</b></td></tr>';
      c.incl10+=r.incl10;c.ex10+=a.ex;c.tax10+=a.tax;c.incl8+=r.incl8;c.ex8+=b.ex;c.tax8+=b.tax;c.taxable+=taxable; });
    body+='<tr class="total"><td class="l">全社 合計</td><td>'+yen(c.incl10)+'</td><td>'+yen(c.ex10)+'</td><td class="muted">'+yen(c.tax10)+'</td><td>'+yen(c.incl8)+'</td><td>'+yen(c.ex8)+'</td><td class="muted">'+yen(c.tax8)+'</td><td><b>'+yen(c.taxable)+'</b></td></tr>';
    wrap.innerHTML='<div class="tblwrap"><table style="min-width:820px"><thead>'
      +'<tr><th class="l" rowspan="2" style="vertical-align:bottom">部門</th><th colspan="3" style="text-align:center;border-bottom:1px solid var(--line)">10%</th><th colspan="3" style="text-align:center;border-bottom:1px solid var(--line)">8%</th><th rowspan="2" style="vertical-align:bottom">課税売上<br>(税抜)</th></tr>'
      +'<tr><th>税込</th><th>税抜</th><th>消費税</th><th>税込</th><th>税抜</th><th>消費税</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }
  const bodyEl=()=>document.getElementById('texBody');
  function save(){ Notes.set(key, JSON.stringify(rows)); renderMain(); }
  function drawInputs(){
    const opt=sel=>depts.map(d=>'<option value="'+d.id+'"'+(d.id===sel?' selected':'')+'>'+d.name+'</option>').join('');
    bodyEl().innerHTML = rows.map((r,i)=>'<tr>'
      +'<td class="l"><input data-i="'+i+'" data-f="name" value="'+(r.name||'').replace(/"/g,'&quot;')+'" placeholder="名称" style="width:130px;'+inp+'"></td>'
      +'<td><select data-i="'+i+'" data-f="dept" style="'+inp+'">'+opt(r.dept)+'</select></td>'
      +'<td><input data-i="'+i+'" data-f="incl10" inputmode="numeric" value="'+(r.incl10||'')+'" placeholder="0" style="width:100px;text-align:right;'+inp+'"></td>'
      +'<td><input data-i="'+i+'" data-f="incl8" inputmode="numeric" value="'+(r.incl8||'')+'" placeholder="0" style="width:100px;text-align:right;'+inp+'"></td>'
      +'<td><button type="button" class="texdel" data-i="'+i+'" style="border:1px solid var(--line);background:none;color:var(--bad);border-radius:7px;padding:5px 9px;cursor:pointer">×</button></td>'
      +'</tr>').join('') || '<tr><td class="l muted" colspan="5" style="padding:12px">「＋ 行を追加」で部門指定のPOS外売上を入力</td></tr>';
    bodyEl().querySelectorAll('input,select').forEach(el=>{
      const ev=el.tagName==='SELECT'?'change':'input';
      el.addEventListener(ev,()=>{ const i=+el.dataset.i,f=el.dataset.f;
        rows[i][f]=(f==='name'||f==='dept')? el.value : (parseFloat((el.value||'').replace(/,/g,''))||0);
        save(); });
    });
    bodyEl().querySelectorAll('.texdel').forEach(b=>b.addEventListener('click',()=>{ rows.splice(+b.dataset.i,1); save(); drawInputs(); }));
  }
  Notes.get(key,v=>{ try{ rows=v?JSON.parse(v):[]; }catch(e){ rows=[]; } if(!Array.isArray(rows))rows=[];
    rows.forEach(r=>{ if(r.dept===undefined) r.dept='__other'; });
    renderMain(); drawInputs(); });
  const add=document.getElementById('texAdd');
  if(add) add.onclick=()=>{ rows.push({name:'',dept:(DATA.divisions[0]&&DATA.divisions[0].id)||'__other',incl10:0,incl8:0}); save(); drawInputs(); };
}

function uv(v){ if(v===null||v===undefined||isNaN(v)) return '<span class="muted">—</span>'; return Math.round(v/curUnit).toLocaleString('ja-JP'); }
function deptDays(deptId){ const p=DATA.periods[curMonth]; if(!p) return null;

function dailyMatrix(deptId){
  const div=DATA.divisions.find(d=>d.id===deptId);
  if(div&&div.tkcOnly) return '<div class="card"><div class="card-h"><span class="nm">日別は非対応</span><span class="mn">'+div.name+'はPOSを通さず売上をTKC月次試算表から取得するため、日別内訳がありません。「月合計」でご覧ください。</span></div></div>';
  const days=deptDays(deptId);
  if(!days||!days.length) return '<div class="card"><div class="card-h"><span class="nm">日別データなし</span><span class="mn">この月のPOS日次がありません</span></div></div>';
  const showK = deptId!=='__company' && days.some(x=>x.k!==null&&x.k!==undefined);
  let head='<thead><tr><th class="stk l">項目</th>';
  for(const x of days){ const c=x.w===0?'sun':x.w===6?'sat':''; head+='<th class="'+c+'">'+x.d+'<span class="dw">'+DOW[x.w]+'</span></th>'; }
  head+='<th class="mtot">月合計</th></tr></thead>';
  function row(label,get,fmt,sub){
    let tot=0,any=false,tr='<tr'+(sub?' class="mrow-sub"':'')+'><td class="stk l">'+label+'</td>';
    for(const x of days){ const c=x.w===0?'sun':x.w===6?'sat':''; const v=get(x);
      tr+='<td class="'+c+'">'+(v===null||v===undefined?'<span class="muted">—</span>':fmt(v))+'</td>';
      if(typeof v==='number'){ tot+=v; any=true; } }
    tr+='<td class="mtot">'+(any?fmt(tot):'<span class="muted">—</span>')+'</td></tr>'; return tr;
  }
  let body='<tbody>';
  body+=row('売上高（税抜）',x=>x.u,uv,true);
  if(showK){
    body+=row('客数',x=>x.k,v=>Math.round(v).toLocaleString('ja-JP'),false);
    // 客単価は合計を別計算（Σ売上/Σ客数）
    let su=0,sk=0; days.forEach(x=>{ if(typeof x.u==='number')su+=x.u; if(typeof x.k==='number')sk+=x.k; });
    let tr='<tr><td class="stk l">客単価</td>';
    for(const x of days){ const c=x.w===0?'sun':x.w===6?'sat':''; const t=(x.k?Math.round(x.u/x.k):null);
      tr+='<td class="'+c+'">'+(t?t.toLocaleString('ja-JP'):'<span class="muted">—</span>')+'</td>'; }
    tr+='<td class="mtot">'+(sk?Math.round(su/sk).toLocaleString('ja-JP'):'<span class="muted">—</span>')+'</td></tr>';
    body+=tr;
  }
  // 人時（KoTシフト）
  if(days.some(x=>x.nj!=null)){
    body+=row('人時（シフト）',x=>x.nj,v=>v.toFixed(1),false);
    let su=0,sn=0; days.forEach(x=>{ if(typeof x.u==='number')su+=x.u; if(typeof x.nj==='number')sn+=x.nj; });
    const perH=v=>Math.round(v).toLocaleString('ja-JP');
    let tr='<tr><td class="stk l">人時売上高<span class="dw">円/人時</span></td>';
    for(const x of days){ const c=x.w===0?'sun':x.w===6?'sat':''; const t=(x.nj?x.u/x.nj:null);
      tr+='<td class="'+c+'">'+(t?perH(t):'<span class="muted">—</span>')+'</td>'; }
    tr+='<td class="mtot">'+(sn?perH(su/sn):'<span class="muted">—</span>')+'</td></tr>';
    body+=tr;
  }
  body+='</tbody>';
  return '<div class="card"><div class="card-h"><span class="nm">日次速報・日別</span><span class="mn">'+deptName(deptId)+'／横軸=日付 '+unitLabel()+'　土=青・日=赤</span></div>'
    +'<div class="tblwrap"><table style="min-width:900px">'+head+body+'</table></div>'
    +'<div style="padding:8px 16px 12px;font-size:11px;color:var(--muted)">※日別は各店のPOS日次売上（純売上・税抜／付替反映）。人時はKing of Timeのシフトから自動集計（退勤−出勤−休憩）。人時売上高＝売上÷人時。原価・営業利益はTKCが月次のため「月合計」で表示。</div></div>';
}

const PLROWS=[
  ['sales','売上高','売上高','—','sub'],
  ['cost','売上原価','売上原価','変動','cost'],
  ['gross','売上総利益','粗利益','—','sub'],
  ['labor','人件費','人件費','変動',''],
  ['rent','地代家賃','家賃','固定',''],
  ['dep','減価償却費','減価償却','固定',''],
  ['util','水道光熱費','水道光熱','変動',''],
  ['lease','リース料','リース','固定',''],
  ['other','その他販管費','その他','変動',''],
  ['sga','販売管理費計','販管費計','—','sub'],
  ['operating','営業利益','営業利益','—','op'],
  ['fl','FL合計','FL','—','sub'],
  ['flr','FLR率','FLR','—','flr'],
];
function plGet(t,key){ if(!t) return null;
  if(key==='sales')return t.sales; if(key==='cost')return t.cost;
  if(key==='gross')return (t.gross!=null?t.gross:(t.sales-t.cost));
  if(key==='sga')return t.sga; if(key==='operating')return t.operating; if(key==='labor')return t.labor;
  if(key==='fl')return (t.cost||0)+(t.labor||0);
  if(key==='flr')return null;
  const c=t.sgaComp||{}; return (key in c)?c[key]:null;
}
function laborOnlyCard(deptId){
  const lab=deptLabor(deptId); if(!lab||!lab.ninji) return '';

}
function monthlyMatrix(deptId){
  const t=deptTkc(deptId);
  if(!t){ const lc=laborOnlyCard(deptId);
    return lc || '<div class="card"><div class="card-h"><span class="nm">損益データなし</span><span class="mn">この月はTKC試算表が未取込です。日別の売上は「日別」でご覧いただけます。</span></div></div>'; }
  const prev=t.prev||null; const sales=t.sales||0;

  const badge=an?' <span class="chip '+(an.level==='alert'?'bad':'warn')+'">⚠ 異常値</span>':'';
  let head='<thead><tr><th class="stk l">勘定科目</th><th class="stk2">みしな標準科目</th><th>固定/変動</th><th>実績</th><th>売上比</th><th>昨年実績</th><th>昨年比</th></tr></thead>';
  let body='<tbody>';
  for(const [key,name,std,fv,cls] of PLROWS){
    let val,ratioCell,valCell,pyCell,yoyCell='<span class="muted">—</span>';
    if(key==='flr'){ const fl=(t.cost||0)+(t.labor||0); val=sales?fl/sales*100:null;
      valCell=(val!==null?val.toFixed(1)+'%':'<span class="muted">—</span>'); ratioCell='<span class="muted">—</span>';
      const pfl=prev?((prev.cost||0)+(prev.labor||0)):null; const ps=prev?prev.sales:null;
      pyCell=(pfl!==null&&ps)?(pfl/ps*100).toFixed(1)+'%':'<span class="muted">—</span>';
    } else {
      val=plGet(t,key); valCell=uv(val); ratioCell=(sales&&val!=null)?(val/sales*100).toFixed(1)+'%':'<span class="muted">—</span>';
      const pv=prev?plGet(prev,key):null; pyCell=uv(pv);
      if(pv&&val!=null){ const yoy=(val-pv)/pv*100;
        const favUp=(key==='sales'||key==='gross'||key==='operating'); // 増=良い項目
        const good = favUp?(yoy>=0):(yoy<=0);
        yoyCell='<span class="'+(good?'pos':'neg')+'">'+(yoy>=0?'+':'')+yoy.toFixed(1)+'%</span>'; }
    }
    const rc=cls==='op'?'mrow-op':((cls==='sub'||cls==='flr')?'mrow-sub':'');
    const nmeHtml = (key==='operating')?('営業利益率 '+opRatioCell(t.opRatio)):'';
    body+='<tr class="'+rc+'"><td class="stk l">'+name+(key==='operating'&&t.opRatio!=null?' <span style="font-weight:600;font-size:11px" class="muted">('+(t.opRatio*100).toFixed(1)+'%)</span>':'')+'</td>'
      +'<td class="stk2">'+std+'</td><td class="fv">'+fv+'</td><td>'+valCell+'</td><td class="muted">'+ratioCell+'</td><td>'+pyCell+'</td><td>'+yoyCell+'</td></tr>';
  }
  // 労務（KoTシフト由来の人時・理論人件費）
  const lab=deptLabor(deptId);
  if(lab&&lab.ninji){
    const s=sales;
    const lrow=(name,val,ratio)=>'<tr><td class="stk l">'+name+'</td><td class="stk2"></td><td class="fv"></td><td>'+val+'</td><td class="muted">'+(ratio||'—')+'</td><td class="muted">—</td><td class="muted">—</td></tr>';
    body+='<tr class="mrow-sub"><td class="stk l">労務（KoTシフト）</td><td class="stk2"></td><td class="fv"></td><td></td><td></td><td></td><td></td></tr>';
    body+=lrow('総人時（シフト）', lab.ninji.toFixed(1)+' h', '');
    if(lab.theoLabor!=null) body+=lrow('理論人件費（人時×'+(lab.wage?('¥'+lab.wage.toLocaleString('ja-JP')):'時給')+'）', uv(lab.theoLabor), s?(lab.theoLabor/s*100).toFixed(1)+'%':'');
    body+=lrow('人時売上高（円/人時）', s?Math.round(s/lab.ninji).toLocaleString('ja-JP'):'<span class="muted">—</span>', '');
  }
  body+='</tbody>';
  let h='<div class="card"><div class="card-h"><span class="nm">日次速報・月合計'+badge+'</span><span class="mn">'+deptName(deptId)+'／実績・売上比・昨年比 '+unitLabel()+'</span></div>'
    +'<div class="tblwrap"><table style="min-width:640px">'+head+body+'</table></div>';

  h+='<div style="padding:8px 16px 12px;font-size:11px;color:var(--muted)">※売上=POS純売上、原価・費用=TKC月間発生（部門別）。営業利益＝売上−原価−販管費（本部費配賦前）。昨年比は前年同月のTKCが取込済みの科目のみ表示。労務はKing of Timeのシフト由来の人時＝実測、理論人件費＝人時×時給（設定値の概算・TKCの人件費とは別物）。予算列は予算データ確定後に追加予定。</div></div>';
  return h;
}

  const period=DATA.periods[curMonth];
  const nav=NAV.find(n=>n[0]===curView);
  document.getElementById('viewTitle').innerHTML=(nav?nav[1]:'')+'<span class="sub" id="subTitle">／ '+monthLabel(curMonth)+'</span>';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===curView));
  renderCtx();
  let html='';
  if(curView==='weekly'){ html=weeklyCard(); }
  else if(curView==='tkcimport'){ html=tkcStatusCard(); }
  else if(curView==='salesapp'){ html=reconcileCard(period); }
  else if(!period){ html='<div class="card"><div class="card-h"><span class="nm">データなし</span></div></div>'; }
  else if(curView==='dailypl'){ html=dailyPLView(); }
  else if(curView==='deptpl'){ html=plTable(period); html+=addbackNote(period,null); }
  else if(curView==='taxsplit'){ html=taxsplitCard(period); }
  else if(curView==='overview'){
    const c=period.company;
    // POS外手入力(税率別内訳)を部門売上・全社合計に加算
    const tex=texByDept(curMonth);
    let oRows=c.rows.map(r=>({...r})); let oTotal={...c.total}; let texSum=0;
    const texBadge=' <span class="chip" style="background:var(--accbg);color:var(--accentd);font-size:10px;padding:1px 6px">手入力含</span>';
    DATA.divisions.forEach((d,i)=>{ if(tex[d.id]&&i<oRows.length){ const u=(oRows[i].uri||0)+tex[d.id];
      oRows[i]={...oRows[i], name:oRows[i].name+texBadge, uri:u, _tex:tex[d.id], tanka:(oRows[i].kyaku?Math.round(u/oRows[i].kyaku):oRows[i].tanka)}; } });
    if(tex['__other']){ oRows=oRows.concat([{name:'その他（POS外）',uri:tex['__other'],kyaku:null,tanka:null,zennenhi:null,_tex:tex['__other']}]); }
    Object.keys(tex).forEach(k=>texSum+=tex[k]);
    if(texSum){ oTotal={...oTotal, uri:(oTotal.uri||0)+texSum, tanka:(oTotal.kyaku?Math.round(((oTotal.uri||0)+texSum)/oTotal.kyaku):oTotal.tanka)}; }
    html+='<div class="card"><div class="card-h"><span class="nm">全社サマリー</span><span class="mn">'+monthLabel(curMonth)+(texSum?'／POS外手入力 '+yen(texSum)+'円 を反映':'')+'</span></div>'+tableHTML(oRows,oTotal,'全社 合計')+'</div>';
    if(texSum) html+='<div style="padding:0 2px 14px;font-size:11px;color:var(--muted)">※「その他（POS外）」及び「手入力含」の売上高は、税率別内訳の手入力（POSを通さない売上・課税売上税抜）を加算したものです。客数・原価率等はPOS/TKC由来のため手入力分を含みません。</div>';
    if(period.adjustNotes&&period.adjustNotes.length) html+='<div style="padding:0 2px 14px;font-size:11.5px;color:var(--accentd);line-height:1.8;font-weight:600">🛠 売上調整: '+period.adjustNotes.join('<br>🛠 売上調整: ')+'</div>';
    html+=addbackNote(period,null);
    if(c.inv) html+=invCard(c.inv,'全社');
    html+=notesDigestCard();
  }
  else if(curView==='breakdown'){
    DATA.divisions.forEach(d=>{ const dd=period.divisions[d.id]; if(!dd) return;
      html+='<div class="card-h" style="padding:2px 2px 8px"><span class="nm">'+d.name+'</span></div>';
      const bc=breakdownCard(dd.breakdown,d.name); const tc=topCard(d.name,dd.top);
      if(!bc&&!tc) html+='<div class="card"><div class="card-h"><span class="mn">'+d.name+'：内訳・商品データなし</span></div></div>';
      html+=bc+tc; });
  }
  else if(curView==='inventory'){
    DATA.divisions.forEach(d=>{ const dd=period.divisions[d.id]; if(dd&&dd.inv) html+=invCard(dd.inv,d.name); });
    if(period.company.inv) html+=invCard(period.company.inv,'全社');
    if(!html) html='<div class="card"><div class="card-h"><span class="nm">棚卸データなし</span></div></div>';
  }
  else if(curView==='notes'){
    html+=notesDigestCard();
    DATA.divisions.forEach(d=>{ html+='<div class="card-h" style="padding:6px 2px 8px"><span class="nm">'+d.name+'</span></div>'+noteBlock(d.id); });
  }
  document.getElementById('view').innerHTML=html;
  hydrateNotes();
  hydrateTaxExtra();
}

function build(){
  curMonth=DATA.defaultMonth;
  const navEl=document.getElementById('nav');
  navEl.innerHTML=NAV.map(n=>'<button data-v="'+n[0]+'"><svg viewBox="0 0 24 24">'+n[2]+'</svg>'+n[1]+'</button>').join('');
  navEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{ curView=b.dataset.v; render(); });
  const sel=document.getElementById('monthSel');
  const fys=[...new Set(DATA.months.map(m=>m.fy))].sort((a,b)=>b-a);
  let html='';
  for(const fy of fys){ const items=DATA.months.filter(m=>m.fy===fy).sort((a,b)=>(b.ord||0)-(a.ord||0)); if(!items.length)continue;
    html+='<optgroup label="'+fy+'年度">'+items.map(m=>'<option value="'+m.key+'"'+(m.key===curMonth?' selected':'')+'>'+m.label+'</option>').join('')+'</optgroup>'; }
  sel.innerHTML=html; sel.value=curMonth;
  monthOrder=DATA.months.slice().filter(m=>/^\d{6}$/.test(m.key)).sort((a,b)=>(a.fy-b.fy)||((a.ord||0)-(b.ord||0))).map(m=>m.key);
  const prevBtn=document.getElementById('monthPrev'), nextBtn=document.getElementById('monthNext');
  function setMonth(k){ curMonth=k; sel.value=k; updateArrows(); render(); }
  function updateArrows(){ const i=monthOrder.indexOf(curMonth); prevBtn.disabled=(i<=0); nextBtn.disabled=(i<0||i>=monthOrder.length-1); }
  sel.onchange=()=>setMonth(sel.value);
  prevBtn.onclick=()=>{ const i=monthOrder.indexOf(curMonth); if(i>0) setMonth(monthOrder[i-1]); };
  nextBtn.onclick=()=>{ const i=monthOrder.indexOf(curMonth); if(i>=0&&i<monthOrder.length-1) setMonth(monthOrder[i+1]); };
  updateArrows();
  const share=(Notes.mode==='cloud')?'<span style="color:var(--good);font-weight:700">● コメント共有: ON</span>':'<span style="color:var(--muted)">○ コメント共有: OFF（このPCのみ）</span>';
  document.getElementById('meta').innerHTML=share+'<br>元データ: '+DATA.sourceFile+'　生成: '+DATA.generatedAt;
  document.getElementById('sfoot').innerHTML='生成: '+DATA.generatedAt+'<br>毎朝8:00 自動更新';
  document.getElementById('foot').innerHTML='売上高＝POS純売上（税抜）。パン（○円パン/スタッフ割パン）はとんかつ店ぶんをベーカリーへ税抜換算で移管済。仕出し（Ｔ仕出し）はとんかつ店から仕出し部門へ税抜換算（8%）で移管しており、レジで組数・客数が取れないため客数・客単価は「—」。金曜日のみしな（週1の催事出店）はPOSを通さないため、売上・費用ともTKC部門別試算表から取得。原価・人件費・営業利益はTKC月間発生（部門別）から算出（営業利益＝売上−原価−販管費、本部費配賦前）。売上商品ランキングはレシート明細の税込集計。ベーカリーの客単価はまきばのソフト・100日を除外して算出。前年比は過去年の同月JNL／TKC蓄積分から算出。';
  render();
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  btn.disabled=true; btn.textContent='確認中…'; err.textContent='';
  try{
    DATA=JSON.parse(await decryptData(pw));
    document.getElementById('login').style.display='none';
    document.querySelector('.app').style.display='';
    build();
  }catch(ex){ err.textContent='パスワードが違います'; btn.disabled=false; btn.textContent='開く'; document.getElementById('pw').select(); }
});
</script>
